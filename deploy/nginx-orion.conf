# Сайт ORION и бот на одном домене. Замените example.ru на свой домен (две строки ниже).
# HTTPS добавит certbot: sudo certbot --nginx -d example.ru -d www.example.ru
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    root /opt/orion/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Бот: форма сайта шлёт заявки на /api/lead, Apps Script — письма на /api/mail.
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100k;
    }

    # Файлы сборки с хешем в имени — можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Сама страница не кэшируется: после обновления посетители сразу видят новую версию.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
