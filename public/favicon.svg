<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 58 58">
  <defs>
    <radialGradient id="body" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffd08a" />
      <stop offset="0.38" stop-color="#ff9a2e" />
      <stop offset="0.78" stop-color="#f26a0c" />
      <stop offset="1" stop-color="#c2410c" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" />
      <stop offset="0.5" stop-color="#ff8a1f" />
      <stop offset="1" stop-color="#ff6a00" />
    </linearGradient>
    <clipPath id="planet">
      <circle cx="32" cy="32" r="17" />
    </clipPath>
    <!-- Передняя половина кольца: всё, что ниже его оси. -->
    <clipPath id="front">
      <rect x="-8" y="32" width="80" height="40" />
    </clipPath>
    <!-- Прорезь в планете вдоль передней дуги кольца — кольцо читается поверх. -->
    <mask id="cut">
      <rect width="64" height="64" fill="#fff" />
      <g transform="rotate(-20 32 32)" clip-path="url(#front)">
        <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="#000" stroke-width="7.5" />
      </g>
    </mask>
  </defs>

  <!-- Задняя половина кольца уходит за планету. -->
  <g transform="rotate(-20 32 32)">
    <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="url(#ring)" stroke-width="3.6" />
  </g>

  <g mask="url(#cut)">
    <circle cx="32" cy="32" r="17" fill="url(#body)" />
    <!-- Мягкие полосы атмосферы. -->
    <g clip-path="url(#planet)" fill="none" stroke="#b83d08" stroke-linecap="round" opacity="0.28">
      <path d="M12 25c8 3 26 3 40-3" stroke-width="2.2" />
      <path d="M12 38c10 4 28 3 40-4" stroke-width="1.6" />
    </g>
    <circle cx="25.5" cy="24" r="4.2" fill="#fff4e0" opacity="0.35" />
  </g>

  <!-- Передняя половина кольца. -->
  <g transform="rotate(-20 32 32)" clip-path="url(#front)">
    <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="url(#ring)" stroke-width="3.6" />
  </g>
</svg>
